name: Keep the Intensive server awake

# A free Supabase project pauses after a week without requests. This calls its
# harmless ping() once a day with the public key from
# src/features/intensive/config.ts. It needs no secrets and does nothing while
# the server is not configured. Schedules run only from the default branch.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/intensive-server.mjs
            scripts/intensive-keepalive.mjs
            src/features/intensive/config.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/intensive-keepalive.mjs
