name: iOS app (simulator check, unsigned build)

# The iOS shell (ios-app/) is built on a GitHub macOS runner: there is no Mac and no paid
# Apple account yet. It never signs anything, uses no secret and never deploys: it only
# runs on the app branch or by hand, and uploads screenshots and an unsigned .ipa as
# short-lived artifacts. Pages and the Intensive keep-awake job are separate workflows.
on:
  push:
    branches: [claude/ios-app]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    if: github.ref != 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 170
    env:
      WATCHER_SITE_URL: https://code-of-stalker.github.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Versions
        id: version
        run: |
          echo "marketing=$(node -p "const d = new Date(); [d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()].join('.')")" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available

      # Release web content: the same export as the site and the Android app.
      - run: npx expo export --platform web --output-dir .expo-ios-export
      - run: node scripts/ios/stage-ios-app.mjs .expo-ios-export
      - name: Generate the Xcode project
        working-directory: ios-app
        run: xcodegen generate
      - name: Simulator test build (release content, HARNESS on)
        working-directory: ios-app
        run: |
          xcodebuild build -project CodeOfStalker.xcodeproj -scheme CodeOfStalker -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd-sim" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) HARNESS' \
            MARKETING_VERSION=${{ steps.version.outputs.marketing }} CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }}
          mkdir -p "$RUNNER_TEMP/apps/check"
          cp -R "$RUNNER_TEMP/dd-sim/Build/Products/Release-iphonesimulator/CodeOfStalker.app" "$RUNNER_TEMP/apps/check/"
      - name: Unsigned device build (.ipa, no HARNESS)
        working-directory: ios-app
        run: |
          xcodebuild archive -project CodeOfStalker.xcodeproj -scheme CodeOfStalker -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/CodeOfStalker.xcarchive" -derivedDataPath "$RUNNER_TEMP/dd-device" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=${{ steps.version.outputs.marketing }} CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }}
          app="$RUNNER_TEMP/CodeOfStalker.xcarchive/Products/Applications/CodeOfStalker.app"
          if strings "$app/CodeOfStalker" | grep -q harnessEvents; then echo "The device build must not carry the test harness"; exit 1; fi
          plutil -p "$app/Info.plist" | grep -E 'CFBundle(Identifier|DisplayName|ShortVersionString|Version)"|MinimumOSVersion'
          lipo -info "$app/CodeOfStalker"
          du -sh "$app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" "$RUNNER_TEMP/out"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          name="CodeOfStalker-unsigned-${{ steps.version.outputs.marketing }}-${{ steps.version.outputs.sha }}.ipa"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/out/$name" Payload)
          ls -l "$RUNNER_TEMP/out"

      # Development web content (__DEV__): the Intensive talks to the in-memory demo server.
      - run: npx expo export --platform web --dev --output-dir .expo-ios-demo-export
      - run: node scripts/ios/stage-ios-app.mjs .expo-ios-demo-export
      - name: Simulator demo build (development content, HARNESS on)
        working-directory: ios-app
        run: |
          xcodebuild build -project CodeOfStalker.xcodeproj -scheme CodeOfStalker -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd-demo" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) HARNESS' \
            MARKETING_VERSION=${{ steps.version.outputs.marketing }} CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }}
          mkdir -p "$RUNNER_TEMP/apps/demo"
          cp -R "$RUNNER_TEMP/dd-demo/Build/Products/Release-iphonesimulator/CodeOfStalker.app" "$RUNNER_TEMP/apps/demo/"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-unsigned-ipa
          path: ${{ runner.temp }}/out/*.ipa
          if-no-files-found: warn
          retention-days: 14

      # One step per part, each uploading its own results: run 4 lost its runner after 93 minutes
      # and with it every result, so a late failure now costs only the part in progress.
      # Run 3 took 30 min (iPhone), 1 (Intensive), 9 (iPad), 3 (graphics).
      - name: Simulator checks, iPhone (offline fence on)
        timeout-minutes: 60
        run: |
          node ios-app/harness/run.mjs --app "$RUNNER_TEMP/apps/check/CodeOfStalker.app" \
            --only phone --out "$RUNNER_TEMP/ios-check/phone"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-check-phone
          path: ${{ runner.temp }}/ios-check/phone
          if-no-files-found: warn
          retention-days: 14

      - name: Simulator checks, Intensive on the demo server (offline fence on)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          node ios-app/harness/run.mjs --app "$RUNNER_TEMP/apps/check/CodeOfStalker.app" \
            --demo "$RUNNER_TEMP/apps/demo/CodeOfStalker.app" --only intensive --out "$RUNNER_TEMP/ios-check/intensive"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-check-intensive
          path: ${{ runner.temp }}/ios-check/intensive
          if-no-files-found: warn
          retention-days: 14

      - name: Simulator checks, iPad (offline fence on)
        if: ${{ !cancelled() }}
        timeout-minutes: 35
        run: |
          node ios-app/harness/run.mjs --app "$RUNNER_TEMP/apps/check/CodeOfStalker.app" \
            --only ipad --out "$RUNNER_TEMP/ios-check/ipad"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-check-ipad
          path: ${{ runner.temp }}/ios-check/ipad
          if-no-files-found: warn
          retention-days: 14

      - name: Simulator graphics pass (information only, offline fence on)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          node ios-app/harness/run.mjs --app "$RUNNER_TEMP/apps/check/CodeOfStalker.app" \
            --only graphics --out "$RUNNER_TEMP/ios-check/graphics"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-check-graphics
          path: ${{ runner.temp }}/ios-check/graphics
          if-no-files-found: warn
          retention-days: 14
