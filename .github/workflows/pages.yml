name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the deploy job may publish. The build job installs and runs third-party
# packages, so it gets read access and nothing else.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Install scripts are skipped: the web export needs none of them. They only
      # fetch and check the Matrix SDK's Android binaries.
      - run: npm ci --ignore-scripts
      # The Rust engine is prebuilt into public/graphics/pkg, so no Rust toolchain is needed here.
      - run: npm run export:web
        env:
          WATCHER_SITE_URL: https://code-of-stalker.github.io
      # Single-page app: unknown paths such as /practice fall back to the app shell.
      - run: cp .expo-rust-web-export/index.html .expo-rust-web-export/404.html && touch .expo-rust-web-export/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .expo-rust-web-export

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
