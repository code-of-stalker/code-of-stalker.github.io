        <div class="wbq-copy">
          <p>Автор Один.<br>Автор Целостен и Неделим.</p>
          <p>И в каждой книге — Он Сам, как Главный Герой — излучает Себя в уникальной форме себя.</p>
        </div>
      <svg class="wbq-art" width="288" height="206" viewBox="0 0 288 206" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wbq-title wbq-desc">
        <title id="wbq-title">Главный Герой — свет из книги</title>
        <desc id="wbq-desc">Книга раскрывается, и свет со страниц собирает человеческую фигуру. Затем проекция плавно гаснет, страницы возвращаются, обложка закрывается. Книга остаётся закрытой до повторного запуска.</desc>

    const ribbon=surface('bookmark','#35300D','#8D822D',.25);
    const coverRim=surface('front-cover-edge','#22210A','#AAA032',.5);
    const cover=surface('front-cover','#080A04','url(#wbq-gold)',.8);
    const leaves=[0,1,2,3].map(i=>surface('turning-page-'+i,i===3?'#151609':'#0C0E06',i===3?'#C0B84D':'#77732A',i===3?.45:.28));
    const foil=make('path',{fill:'none',stroke:'#BEB445','stroke-width':.4,opacity:.65},cover.group);
    const pageShine=make('path',{fill:'none',stroke:'#FAEF9C','stroke-width':.6,opacity:0},baseRight.group);
    let centerX=144;
    const yaw=0,elevation=.52,cy=cos(yaw),sy=sin(yaw),ce=cos(elevation),se=sin(elevation);
    function project(p){const x=p[0]*cy+p[2]*sy,z=p[0]*sy*-1+p[2]*cy;const depth=z*ce+p[1]*se;const perspective=650/(650-depth);return [centerX+x*perspective,166+(z*se-p[1]*ce)*perspective,depth];}
    const xy=p=>{const q=project(p);return q[0].toFixed(3)+' '+q[1].toFixed(3)};
    const line=(points,close=false)=>points.map((p,i)=>(i?'L':'M')+xy(p)).join('')+(close?'Z':'');
    const sample=(fn,start,end,n=20)=>Array.from({length:n+1},(_,i)=>fn(start+(end-start)*i/n));
    const rectangle=(fn,width,depth,inset=0)=>[...sample(u=>fn(u,-depth+inset),inset,width-inset),...sample(v=>fn(width-inset,v),-depth+inset,depth-inset,6),...sample(u=>fn(u,depth-inset),width-inset,inset),...sample(v=>fn(inset,v),depth-inset,-depth+inset,6)];
    const depthOf=points=>points.reduce((s,p)=>s+project(p)[2],0)/points.length;
    function updateSurface(item,points,detail='',glint=''){set(item.face,'d',line(points,true));set(item.detail,'d',detail);set(item.glint,'d',glint);item.depth=depthOf(points);}
    function rigid(angle,height,offset=0){return (u,v)=>[u*cos(angle)-offset*sin(angle),height+u*sin(angle)+offset*cos(angle),v];}
    // Arc-length integration: every page keeps its authored width while it bends.
    function paper(angle,height,bend,width=70){
      const steps=56,table=[[0,height]],ds=width/steps;
      for(let j=1;j<=steps;j++){const u=(j-.5)/steps,a=angle+bend*sin(PI*u);const prev=table[j-1];table.push([prev[0]+ds*cos(a),prev[1]+ds*sin(a)]);}
      return (u,v)=>{const at=clamp(u/width)*steps,i=Math.min(steps-1,Math.floor(at)),f=at-i;return [table[i][0]+(table[i+1][0]-table[i][0])*f,table[i][1]+(table[i+1][1]-table[i][1])*f,v];};
    }
    function writing(fn){let d='';for(let row=0;row<8;row++){const v=-30+row*8+(row>3?3:0);let u=12;for(let word=0;word<4;word++){const length=5+((row*7+word*11)%8);if(u+length>62||row===7&&word>1)break;d+=line(sample(x=>fn(x,v),u,u+length,5));u+=length+2.5;}}return d;}
    function drawBook(t){
      const opening=envelope(t,.035,.245,.885,.997),angle=opening*PI;
      centerX=144-41.4*(1-opening);
      const base=(u,v)=>[u+3.4,-2,v];updateSurface(back,rectangle(base,76,47),line(rectangle(base,76,47,3),true),line(sample(u=>base(u,47),3,74)));
      const right=paper(.018*opening,3.06,.055*opening);
      const rightBottom=paper(.018*opening,-1.8,.055*opening);
      updateSurface(rightEdge,[...sample(u=>right(u,43),0,70),...sample(u=>rightBottom(u,43),70,0)],
        [0,1,2].map(i=>line(sample(u=>paper(.018*opening,-1+i*.75,.055*opening)(u,43),1,69))).join(''));
      updateSurface(baseRight,rectangle(right,70,43),writing(right),line(sample(v=>right(70,v),-41,41)));
      // A finite-width binding: the front cover pivots around the spine's
      // centre and settles level with the back cover when fully open.
      const rootX=3.4*cos(angle)-3.4*sin(angle);
      const rootY=.3+3.4*sin(angle)+3.4*cos(angle);
      const coverPoint=offset=>{const f=rigid(angle,rootY,offset);return(u,v)=>{const p=f(u,v);p[0]+=rootX;return p;};};
      const rigidOuter=coverPoint(1.1),rigidInner=coverPoint(-1.1);
      const facing=cos(angle)>0?rigidOuter:rigidInner;
      updateSurface(coverRim,[...sample(v=>rigidOuter(76,v),-47,47,8),...sample(v=>rigidInner(76,v),47,-47,8)],'',line(sample(v=>rigidOuter(76,v),-44,44,8)));
      updateSurface(cover,rectangle(facing,76,47),line(rectangle(facing,76,47,4),true),line(sample(u=>facing(u,-47),4,72)));
      let emblem='';
      for(const u of [33,43])emblem+=line([facing(u,-13),facing(u,13)]);
      emblem+=line([facing(28,-17),facing(48,-17)])+line([facing(28,17),facing(48,17)]);
      set(foil,'d',emblem);set(foil,'opacity',clamp(cos(angle)*1.3)*.65);
      leaves.forEach((leaf,i)=>{
        const open=envelope(t,.065+i*.024,.26+i*.024,.854-i*.014,.978-i*.012);
        const bend=.055*opening*(1-2*open)+sin(PI*open)*(t>.8?.6:-.65)*settings.paper;
        const fn=paper(.018*opening+open*(PI-.036),2.1+i*.32,bend);
        updateSurface(leaf,rectangle(fn,70,43),writing(fn),line(sample(v=>fn(70,v),-40,40,12)));
        set(leaf.face,'fill',i===3?'#151609':'#0D0F06');
        set(leaf.glint,'opacity',.15+.5*sin(PI*open)**2);
      });
      updateSurface(ribbon,[[47,3.8,36],[50,3.8,36],[50,-6,54],[48.5,-4.8,51],[47,-6,54]],'',line([[47.6,3.8,36],[47.6,-5,52]]));
      // Painter order is computed from camera depth, including page crossings.
      const ordered=[...surfaces].sort((a,b)=>a.depth-b.depth);
      const order=ordered.map(s=>s.key).join(',');
      if(book.dataset.order!==order){ordered.forEach(s=>book.append(s.group));book.dataset.order=order;}
      const sFn=right;
      const seam=line(sample(v=>sFn(0,v),-38,42,20));
      set($('.wbq-seam'),'d',seam);set($('.wbq-seam-glow'),'d',seam);
      set(pageShine,'d',line(sample(v=>right(22+33*ramp(t,.29,.4),v),-35,35,20)));
      set(pageShine,'opacity',sin(PI*clamp((t-.29)/.11))*.6);
      set(svg,'data-cover-angle',angle.toFixed(6));
    }
    const filamentNodes=[];
    for(let i=0;i<7;i++){
      const u=(i-3)/3,start=[144+u*13,165-Math.abs(u)*8],finish=[144+u*17,47+Math.abs(u)*23];
      const d=`M${start[0]} ${start[1]}C${144+u*8} 136 ${144+u*28} 91 ${finish[0]} ${finish[1]}`;
      const group=$('.wbq-filaments');
      make('path',{d,fill:'none',stroke:'#EEE563','stroke-width':.25,opacity:.12},group);
      filamentNodes.push(make('path',{d,fill:'none',stroke:'#FFF7BB','stroke-width':.42,'stroke-dasharray':'4 145',opacity:.45},group));
    }
    const grains=[];
    for(let i=0;i<48;i++)grains.push(make('circle',{r:i%5===0?.42:.23,cx:0,cy:0},$('.wbq-grains')));
    let elapsed=0,ambient=0,last=0,previousCycle=settings.cycle,lastBookPhase=-1;
    let visible=true;
    const observer=new IntersectionObserver(entries=>{visible=entries[0]?.isIntersecting??true;});observer.observe(root);
    function draw(t,time=t*settings.cycle){
      const openRange=(t>.03&&t<.36)||(t>.79&&t<1);
      if(lastBookPhase<0||Math.abs(t-lastBookPhase)>.0004&&(openRange||Math.floor(t*20)!==Math.floor(lastBookPhase*20))){drawBook(t);lastBookPhase=t;}
      const sourceLight=envelope(t,.305,.385,.79,.87);
      const form=ramp(t,.365,.555)*(1-ramp(t,.745,.83));
      const y=157-144*form,breath=1+.025*sin(time*1.35);
      set(reveal,'y1',y-11);set(reveal,'y2',y+11);
      set(hero,'opacity',envelope(t,.35,.385,.815,.85));
      set(source,'opacity',sourceLight*settings.glow*breath);
      set(projection,'opacity',sourceLight*settings.beam);
      set($('.wbq-person-fill'),'opacity',settings.fill);
      set($('.wbq-person-glow'),'opacity',settings.glow*.07);
      const heartPulse=envelope(t,.635,.71,.745,.805);
      set($('.wbq-heart-halo'),'opacity',settings.glow*.45*breath*(1+.55*heartPulse));
      set($('.wbq-heart-halo'),'rx',17*(1+.18*heartPulse));
      set($('.wbq-heart-halo'),'ry',20*(1+.18*heartPulse));
      set($('.wbq-heart-core'),'r',.8+.22*heartPulse);
      set(assemblyLight,'cy',y+7);set(assemblyLight,'opacity',form>.02&&form<.99?.9:.08);
      filamentNodes.forEach((n,i)=>set(n,'stroke-dashoffset',-time*13+i*21));
      grains.forEach((n,i)=>{const phase=(time*.115+i*.6180339)%1;set(n,'cx',124+((i*37.133)%40));set(n,'cy',149-phase*124);set(n,'opacity',settings.particles?.35*sin(PI*phase)**2:0);});
      set(svg,'data-progress',t.toFixed(4));
    }
    function sanitize(){
      for(const[key,min,max]of[['cycle',8,24],['glow',0,1.5],['beam',0,1.5],['paper',.2,1.3],['fill',0,1.5]])settings[key]=clamp(Number(settings[key])||0,min,max);
    }
    function render(){
      sanitize();if(settings.cycle!==previousCycle){elapsed=elapsed/previousCycle*settings.cycle;previousCycle=settings.cycle;}
      lastBookPhase=-1;
      root.querySelector('[data-action=play]').textContent=!settings.loop&&elapsed>=settings.cycle?'Повторить':settings.playing?'Пауза':'Продолжить';
      root.querySelector('[data-action=play]').setAttribute('aria-pressed',String(!settings.playing));
      draw(reduced.matches?.65:Math.min(elapsed/settings.cycle,1),reduced.matches?0:ambient);
    }
    function save(){try{window.openai?.setWidgetState?.({modelContent:{kind:'watcher-book-projection-aligned',settings:{...settings}}})?.catch(()=>{});}catch{}}
    function frame(now){
      if(!root.isConnected){observer.disconnect();panelObserver.disconnect();return;}
      const dt=last?Math.min((now-last)/1000,.06):0;last=now;
      if(settings.playing&&!reduced.matches&&!document.hidden&&visible){
        ambient+=dt;elapsed+=dt;
        if(!settings.loop)elapsed=Math.min(elapsed,settings.cycle);
        else if(elapsed>settings.cycle){elapsed%=settings.cycle;lastBookPhase=-1;}
        draw(elapsed/settings.cycle,ambient);
        if(!settings.loop&&elapsed>=settings.cycle){settings.playing=false;render();}
      }
      requestAnimationFrame(frame);
    }
    root.querySelector('[data-action=play]').addEventListener('click',()=>{if(!settings.loop&&elapsed>=settings.cycle){elapsed=0;ambient=0;settings.playing=true;}else settings.playing=!settings.playing;render();save()});
    root.querySelector('[data-action=replay]').addEventListener('click',()=>{elapsed=0;ambient=0;settings.playing=true;render();save()});
    root.querySelector('[data-action=zoom]').addEventListener('click',event=>{const enlarged=root.querySelector('.wbq-product').classList.toggle('wbq-large');event.currentTarget.textContent=enlarged?'1:1':'2×';event.currentTarget.setAttribute('aria-pressed',String(enlarged));});
    window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState,data=saved?.modelContent??saved;if(['watcher-book-projection-v2','watcher-book-projection-aligned'].includes(data?.kind)){Object.assign(settings,defaults,data.settings);render();}});
    // Fit in layout pixels: corners, notch and outline never stretch with the panel.
    const panel=root.querySelector('.wbq-panel'),frameSvg=root.querySelector('.wbq-frame');
    const fitPanel=()=>{
      const {width:w,height:h}=panel.getBoundingClientRect(),e=.125;
      const notch=w*.61;
      frameSvg.setAttribute('viewBox',`0 0 ${w} ${h}`);
      frameSvg.querySelector('path').setAttribute('d',`M${e} ${e}H${notch-24}L${notch-12} 12H${notch+24}L${notch+36} ${e}H${w-18}L${w-e} 18V${h-e}H${e}Z`);
    };
    const panelObserver=new ResizeObserver(fitPanel);panelObserver.observe(panel);fitPanel();
    reduced.addEventListener('change',render);
    render();requestAnimationFrame(frame);
    if(globalThis.Tweak){const tweak=new Tweak({container:root.querySelector('.wbq-product'),onChange:()=>{render();save()}});
      tweak.addSlider(settings,'cycle',{label:'Длительность',min:8,max:24,step:.5,unit:'с'});
      tweak.addSlider(settings,'paper',{label:'Гибкость страниц',min:.2,max:1.3,step:.05});
      tweak.addSlider(settings,'glow',{label:'Свечение',min:0,max:1.5,step:.05});
      tweak.addSlider(settings,'beam',{label:'Нити проекции',min:0,max:1.5,step:.05});
      tweak.addSlider(settings,'fill',{label:'Свет внутри героя',min:0,max:1.5,step:.05});
      tweak.addToggle(settings,'particles',{label:'Частицы внутри проекции'});
      tweak.addToggle(settings,'loop',{label:'Повторять весь цикл'});
    }
    root.wbqPreview={settings,seek:t=>{settings.playing=false;previousCycle=settings.cycle;elapsed=settings.cycle*clamp(t);ambient=elapsed;render();},play:()=>{settings.playing=true;render();},project,rigid,paper};
  })();
  </script>
</div>
