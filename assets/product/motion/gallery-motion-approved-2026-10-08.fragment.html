    tweak.addToggle(state,'orbits',{label:'Движение по орбитам'});
    tweak.addToggle(state,'flow',{label:'Поток энергии в луче'});
    tweak.addSlider(state,'orbitSpeed',{label:'Скорость шариков',min:0,max:2.5,step:.1});

    tweak.addSlider(state,'distortion',{label:'Преломление внутри картин',min:0,max:2,step:.1});
    tweak.addSlider(state,'matrixStrength',{label:'Свечение символов на полу',min:0,max:2,step:.1});

  }
  if (source.complete && source.naturalWidth) build(); else source.addEventListener('load',build,{once:true});
  update();
})();
