  const wall=[[43,77],[550,10],[548,305],[42,281]];

  function restore(snapshot) {

    if(!s||s.source!=='matrix-wall-v1')return;

    for(const k of ['speed','motion','light','rain','scan','refraction','edge','heat','glitches','grid','gridSpeed'])if(Number.isFinite(s[k]))state[k]=Math.max(k==='speed'||k==='gridSpeed'?.2:0,Math.min(2,s[k]));

  function save(){window.openai?.setWidgetState?.({modelContent:{matrixMirror:{source:'matrix-wall-v1',...state}},privateContent:{actual}})?.catch(()=>{});}

    c.bezierCurveTo(201,184,203,177,199,165);c.bezierCurveTo(190,150,195,130,201,122);c.bezierCurveTo(210,111,229,109,242,118);c.bezierCurveTo(256,127,256,148,249,163);

  function radial(c,x,y,rx,ry){c.save();c.translate(x,y);c.scale(rx,ry);const g=c.createRadialGradient(0,0,.44,0,0,1);g.addColorStop(0,'#fff');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(-1,-1,2,2);c.restore();}
  function buildMasks(){
