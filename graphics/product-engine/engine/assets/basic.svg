="0" transform="translate(43 126)" data-rust-node="27"><circle r="17" fill="url(#basic-_R_0_)" stroke="none" data-rust-node="28"></circle><circle r="6" class="af-solid af-warm af-bloom" opacity=".45" data-rust-node="29"></circle><path d="M-6 0H6M0-3V3" class="af-warm" opacity=".3" stroke-width=".65" data-rust-node="30"></path><circle r="1.6" class="af-solid af-warm" data-rust-node="31"></circle></g></svg>