<svg class="af-art" viewBox="28 5 218 150" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" data-rust-node="0"><style data-rust-node="1">.architecture-cover { position:relative; display:block; width:100%; height:100%; padding:0; border:0; border-radius:0; overflow:hidden; background:var(--architecture-bg,#000); color:var(--architecture-color,#e7e100); text-align:left; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:pinch-zoom; user-select:none; -webkit-user-select:none; container-type:inline-size; }
.architecture-cover[data-presentation='artwork'] { background:transparent; }
.architecture-cover:focus-visible { outline:1px solid currentColor; outline-offset:-4px; }
.architecture-frame { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.architecture-artwork { position:absolute; top:7%; left:0; width:100%; height:78%; overflow:hidden; }
.architecture-cover[data-illustration='distance'] .architecture-artwork { top:0; height:100%; }
.architecture-serial { position:absolute; top:12px; left:12px; color:var(--architecture-color); opacity:.55; font:400 8px/1.4 'Disket Mono',monospace; letter-spacing:2px; pointer-events:none; }
.architecture-footer { position:absolute; left:12px; right:24px; bottom:12px; z-index:1; display:flex; flex-direction:column; gap:7px; pointer-events:none; }
.architecture-footer strong { font:500 clamp(17px,7.29cqw,21px)/1.15 'Tektur',sans-serif; text-transform:uppercase; text-shadow:0 0 3px var(--architecture-bg),0 1px 5px var(--architecture-bg); }
.architecture-footer small { opacity:.65; font:400 9px/1.5 'Disket Mono',monospace; }
.architecture-arrow { position:absolute; right:16px; bottom:16px; width:16px; height:16px; pointer-events:none; }
.synchronization-control .synchronization-time { display:flex; flex:none; align-items:center; gap:6px; }
.synchronization-time input { box-sizing:border-box; width:68px; min-height:32px; padding:5px 7px; border:1px solid currentColor; background:transparent; color:inherit; font:inherit; text-align:right; }
.synchronization-control > span > label { min-width:0; }
.diary-cover { position:relative; display:block; width:100%; height:100%; padding:0; border:0; border-radius:0; background:var(--diary-bg,#030402); color:var(--diary-color,#e7e100); text-align:left; cursor:pointer; overflow:hidden; container-type:inline-size; -webkit-tap-highlight-color:transparent; touch-action:pinch-zoom; user-select:none; -webkit-user-select:none; }
.diary-cover:focus-visible { outline:1px solid var(--diary-light,#fff7ba); outline-offset:4px; }
.diary-cover[data-presentation='artwork'] { background:transparent; }
.diary-frame { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.diary-artwork { position:absolute; top:2px; left:0; width:100%; height:65%; overflow:visible; }
.diary-serial { position:absolute; top:12px; left:14px; color:var(--diary-color); opacity:.55; font:400 7px/1.4 'Disket Mono',monospace; letter-spacing:1.5px; pointer-events:none; }
.diary-footer { position:absolute; left:6.25%; bottom:9%; display:flex; flex-direction:column; gap:5px; max-width:80%; pointer-events:none; }
.diary-footer strong { font:500 clamp(18px,8.333cqw,24px)/1.1 'Tektur',sans-serif; }
.diary-footer small { opacity:.65; font:400 clamp(7px,3.125cqw,9px)/1.5 'Disket Mono',monospace; }
.diary-arrow { position:absolute; right:7%; bottom:12%; width:24px; height:24px; pointer-events:none; }
.cw-diary-focus { position:absolute; left:16px; top:184px; width:288px; height:200px; z-index:3; }
.cw-diary-focus[hidden] { display:none; }
.cw-items[hidden],.cw-screen-copy[hidden],.cw-frequency-monitor[hidden] { display:none; }
.diary-editor-intro { margin:16px 0 12px; }
.diary-editor-intro strong { color:#fff59a; font:500 17px/1.3 'Tektur',sans-serif; }
.diary-editor-intro p { margin-top:7px; }
.diary-options { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; margin:12px 0; }
.diary-options>button { min-width:0; min-height:40px; padding:8px 4px; border:1px solid #e7e10025; background:#e7e10004; color:#aaa65c; font:400 9px/1.5 'Disket Mono',monospace; cursor:pointer; }
.diary-options>button[aria-pressed='true'] { border-color:#e7e10080; color:#fff59a; background:#e7e1000c; }
.diary-options--two { grid-template-columns:repeat(2,minmax(0,1fr)); }
.diary-control { display:flex; flex-direction:column; gap:7px; margin-top:18px; }
.diary-control>span { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.diary-control label { color:#b7b36b; font:400 9px/1.5 'Disket Mono',monospace; }
.diary-control output { color:#fff59a; white-space:nowrap; font:400 10px 'Disket Mono',monospace; }
.diary-control input { width:100%; margin:0; accent-color:#e7e100; }
.diary-control small { color:#85814e; font:400 8px/1.65 'Disket Mono',monospace; }
.diary-editor .color-control { margin-top:18px; }
.diary-editor .cw-row-actions>button,.diary-editor .cw-row-actions>button:has(>.lab-icon:only-child) { flex:1; min-width:0; }
.diary-subtitle { display:block; margin:16px 0 8px; color:#d3ce72; font:500 12px 'Tektur',sans-serif; }
.diary-editor [role='status'] { color:#d3ce72; }
.voice-recorder { --vr-energy:0; --vr-arc-visibility:0; --vr-line:1; --vr-glow:.85; --vr-color:#e7e100; --vr-light:#fff59a; width:100%; height:100%; max-width:288px; max-height:260px; overflow:visible; display:grid; grid-template-rows:minmax(0,1fr) 66px; color:var(--vr-color); font-family:'Disket Mono',monospace; user-select:none; }
.vr-button { position:relative; display:block; width:100%; height:100%; min-height:0; padding:0; border:0; color:inherit; background:transparent; cursor:pointer; touch-action:none; -webkit-touch-callout:none; }
.vr-button:disabled { cursor:default; opacity:1; }
.vr-button:focus-visible { outline:1px solid #fff59a; outline-offset:-5px; }
.vr-visual { position:absolute; inset:12px 0 0; display:block; pointer-events:none; }
.vr-art { position:relative; display:block; width:100%; height:100%; overflow:visible; }
.voice-wave-field { position:absolute; inset:0; display:block; width:100%; height:100%; pointer-events:none; z-index:1; }
.vr-glass { position:absolute; display:block; border-radius:50%; overflow:hidden; pointer-events:none;
  background:color-mix(in srgb,var(--vr-glass-fill) var(--vr-glass-opacity),transparent);
  backdrop-filter:blur(var(--vr-glass-blur)); -webkit-backdrop-filter:blur(var(--vr-glass-blur));
  box-shadow:inset 0 1px 0 color-mix(in srgb,var(--vr-glass-light) var(--vr-glass-shine),transparent); }
.vr-glow { stroke:var(--vr-light); opacity:calc((.25 + var(--vr-energy)*.75)*var(--vr-glow)); }
.vr-low-motion>circle { stroke-width:calc(1.15px * var(--vr-line)); }
.vr-low-motion>circle:first-child { stroke-width:calc(.55px * var(--vr-line)); }
.vr-low-motion>.vr-glow { stroke-width:calc(1.7px * var(--vr-line)); }
.vr-fill-arc { opacity:var(--vr-arc-visibility); }
.vr-fill-arc.vr-glow { opacity:calc(var(--vr-arc-visibility) * (.25 + var(--vr-energy)*.75)*var(--vr-glow)); }
.vr-mid-motion>circle { stroke-width:calc(.7px * var(--vr-line)); }
.vr-high-motion { stroke-width:calc(.9px * var(--vr-line)); }
.vr-sphere-motion { stroke-width:calc(.75px * var(--vr-line)); }
.vr-sphere-motion>.vr-glow { stroke-width:calc(1.2px * var(--vr-line)); }
.vr-mic,.vr-speaker { stroke-width:calc(.85px * var(--vr-line)); }
.vr-speaker { display:none; }
.voice-recorder[data-source='playback'] .vr-speaker { display:block; }
.voice-recorder[data-source='playback'] .vr-mic { display:none; }
.voice-recorder[data-state='recording'] .vr-side-marks { display:none; }
.vr-stop { display:none; }
.voice-recorder[data-locked='true'][data-state='recording'] .vr-stop { display:block; }
.voice-recorder[data-locked='true'][data-state='recording'] .vr-mic { display:none; }
.vr-lock { position:absolute; top:0; left:50%; width:24px; height:34px; margin-left:-12px; display:block; opacity:0; color:inherit; transition:opacity .18s ease-out; pointer-events:none; }
.vr-lock>svg { display:block; width:100%; height:100%; overflow:visible; }
.vr-lock::before { content:''; position:absolute; inset:-10px -12px; border-radius:50%; background:radial-gradient(ellipse,#030402f5 20%,#030402d9 40%,#03040280 56%,transparent 75%); filter:blur(2px); }
.vr-lock>svg { position:relative; }
.voice-recorder[data-state='recording'] .vr-lock,.voice-recorder[data-state='requesting'] .vr-lock { opacity:1; }
.vr-time { display:flex; align-items:center; justify-content:center; gap:6px; font:400 10px/14px 'Disket Mono',monospace; letter-spacing:1.5px; color:inherit; opacity:.7; }
.vr-live-dot { width:4px; height:4px; background:currentColor; opacity:.25; }
.voice-recorder[data-state='recording'] .vr-time,.voice-recorder[data-source='playback'] .vr-time { opacity:1; color:var(--vr-light); }
.voice-recorder[data-state='recording'] .vr-live-dot,.voice-recorder[data-source='playback'] .vr-live-dot { opacity:1; box-shadow:0 0 7px var(--vr-color); }
.vr-footer { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:14px; gap:12px; }
.vr-hint { max-width:100%; min-height:13px; padding:0 6px; text-align:center; font:400 10px/13px 'Disket Mono',monospace; letter-spacing:.5px; }
.voice-recorder[data-state='error'] .vr-hint { color:var(--vr-light); font-size:8px; line-height:10px; letter-spacing:0; }
.voice-recorder[data-state='error'] .vr-footer { padding-top:6px; gap:6px; }
@media(prefers-reduced-motion:reduce) { .voice-recorder * { transition:none!important; } }
/*$vite$:1*/html,body,#art{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;user-select:none;-webkit-user-select:none;pointer-events:none;}
*{box-sizing:border-box}button{font:inherit}#art{position:relative;color:#E7E100}
.architecture-serial,.architecture-footer,.architecture-arrow,.architecture-frame,.diary-serial,.diary-footer,.diary-arrow,.diary-frame{display:none!important}
.architecture-artwork{top:0!important;height:100%!important}
.diary-artwork{top:0!important;height:100%!important}
body[data-presentation='card'] .diary-artwork{top:0!important;height:100%!important}
.product-glass,.product-glass-source{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;}
.product-glass-source{z-index:1;}
.product-glass-canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;}
body[data-kind='comparison'] #art>div,body[data-kind='attention'] #art>div,body[data-kind='crowd'] #art>div{height:100%!important;max-height:none!important}
#art>div>svg{width:100%;height:100%}
body[data-kind='comparison'] #art>div>svg,body[data-kind='attention'] #art>div>svg,body[data-kind='crowd'] #art>div>svg{height:100%!important;max-height:none!important}
body[data-kind='crowd'] .mcw-svg{shape-rendering:geometricPrecision;}
/* Keep the smaller people's filled contours legible at fractional SVG scales. */
body[data-kind='crowd'] .mcw-crowd [data-person]>[data-vector-drawing]{stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
body[data-paused='true'] *{animation-play-state:paused!important}
body[data-reduced='true'] *{animation-duration:.001s!important;animation-iteration-count:1!important;animation-fill-mode:forwards!important;transition:none!important}
.af-art{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:.85;stroke-linecap:round;stroke-linejoin:round;color:#E7E100}
.af-dim{opacity:.24}.af-mid{opacity:.52}.af-surface{fill:#0A0C05}.af-solid{fill:currentColor;stroke:none}.af-warm{color:#FFF7BA}.af-bloom{filter:blur(4px)}.af-hairline{stroke-width:.5}
.voice-recorder{width:100%;height:100%;max-width:none;max-height:none;display:block;position:relative}.voice-recorder .vr-button{width:100%;height:100%;position:relative;padding:0;border:0;background:transparent}.voice-recorder .vr-visual{height:100%;inset:0}.voice-recorder .vr-footer{visibility:hidden;position:absolute;pointer-events:none}
body[data-kind='voice'] .vr-lock::before{display:none}

.mx-insight {
  --iw-light: .6; --iw-scan: 100%; --iw-scan-opacity: 0;
  width: 100%; display: block; position: relative; padding: 12px 0; margin: 0; border: 0; border-radius: 0;
  background: transparent; color: var(--mx-yellow); font-family: 'Tektur', 'Disket Mono', sans-serif;
  font-weight: 500; font-size: clamp(14px, 6cqi, 21px); line-height: 1.28; letter-spacing: .3px;
  text-align: left; text-transform: uppercase; isolation: isolate; touch-action: manipulation;
}
.mx-insight-content { display: flex; flex-direction: column; position: relative; }
.mx-decoder-line { display: block; margin: 0; color: #c5c000; }
.mx-decoder-line + .mx-decoder-line { margin-top: 18px; font-weight: 600; color: var(--mx-yellow); font-size: clamp(18px, 7.3cqi, 26px); }
.mx-code-word { display: inline-block; white-space: nowrap; }
.mx-code-glyph { display: inline-grid; position: relative; text-align: center; }
.mx-code-glyph::before { content: attr(data-character); visibility: hidden; }
.mx-code-symbol { position: absolute; inset: 0; overflow: hidden; text-align: center; }
.mx-code-glyph[data-locked='false'] { color: #9c9900; }
.mx-code-glyph[data-locked='true'] { color: inherit; }
.mx-code-glyph[data-active='true'] { color: var(--mx-bright); text-shadow: 0 0 calc(8px * var(--iw-light) / .6) #e7e10066; }
.mx-decoder-scan { position: absolute; left: 0; right: 0; top: var(--iw-scan); height: 1px; background: linear-gradient(90deg,transparent,#a8a100,var(--mx-bright),#a8a100,transparent); opacity: var(--iw-scan-opacity); pointer-events: none; }
.mx-decoder-terminal { position: absolute; width: 5px; height: 7px; background: var(--mx-bright); right: 0; top: 0; opacity: var(--iw-scan-opacity); }

body[data-kind='insight'] #art {container-type:inline-size; --mx-yellow:#f5dd07; --mx-bright:#fff5a2;}
body[data-kind='insight'] .mx-insight{font-family:'Disket Mono',monospace;font-weight:700;font-size:22px;line-height:32px;letter-spacing:2.2px;padding:12px 0;margin-top:12px;}
body[data-kind='insight'] .mx-decoder-line{white-space:nowrap;}
body[data-kind='insight'] .mx-decoder-line+.mx-decoder-line{margin-top:6px;font-size:30px;line-height:42px;font-weight:700;}

